name: eign-newsletter-local

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27127:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - db.adminCommand('ping').ok
      interval: 2s
      timeout: 5s
      retries: 30

  mongo-seed:
    image: mongo:8.0
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./eign_index.companies.json
        target: /imports/companies.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./eign_index.rounds.json
        target: /imports/rounds.json
        read_only: true
        bind:
          create_host_path: false
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mongoimport --host mongo --db eign_index --collection companies --drop --jsonArray --file /imports/companies.json
        mongoimport --host mongo --db eign_index --collection rounds --drop --jsonArray --file /imports/rounds.json
        mongosh --host mongo --quiet eign_index --eval '
          db.companies.createIndex({ slug: 1 }, { unique: true });
          db.companies.createIndex({ notionId: 1 });
          db.companies.createIndex({ industry: 1 });
          db.rounds.createIndex({ companyId: 1 });
          db.rounds.createIndex({ companySlug: 1 });
          db.rounds.createIndex({ notionId: 1 });
        '

  mongo-express:
    image: mongo-express:1.0.2
    restart: unless-stopped
    depends_on:
      mongo-seed:
        condition: service_completed_successfully
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "127.0.0.1:18087:8081"

volumes:
  mongo-data:
